<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Julian Whitney</title><link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: you stand inside a dark blue drum of project panels. Scroll turns it, one panel lights at a time. Type stays in the corners. body.flat is the plain fallback. */
:root{--bg:#050A16;--ice:#CFDAEC;--dim:#7F90AD;--blue:#4A7DEB;--f:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html{background:var(--bg);scrollbar-width:none}html::-webkit-scrollbar{display:none}
body{margin:0;background:var(--bg);color:var(--ice);font:400 12px/1.5 var(--f);letter-spacing:.04em;text-transform:uppercase}
a{color:inherit;text-decoration:none}button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a:hover,button:hover{color:#fff}a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(2,5,12,.78) 100%)}
#grain{position:fixed;inset:-60px;pointer-events:none;opacity:.09;mix-blend-mode:screen;background-size:180px 180px}
#track{height:640vh}
.corner{position:fixed;z-index:2;padding:18px 20px}
#tl{left:0;top:0}#tr{right:0;top:0;display:flex;gap:18px}#bl{left:0;bottom:0;max-width:78vw}#br{right:0;bottom:0;color:var(--dim)}
#tl b{display:block;font-weight:700}#tl span{color:var(--dim)}
#code{display:block;font-weight:700;font-size:clamp(20px,2.4vw,34px);line-height:1.1;letter-spacing:0;min-height:1.1em}
#tag{display:block;color:var(--dim);margin-top:6px;min-height:1.5em}
#tr button,#tr a{min-height:28px}
dialog{width:100%;height:100%;max-width:none;max-height:none;margin:0;border:0;padding:clamp(18px,4vw,48px);background:rgba(5,10,22,.97);color:var(--ice);overflow:auto}
dialog::backdrop{background:var(--bg)}
.vx{display:flex;justify-content:space-between;gap:16px;margin-bottom:18px}
.vx button{min-height:32px}
dialog video{width:100%;max-height:68vh;display:block;background:#000}
dialog h2{font:700 clamp(30px,6vw,72px)/1.02 var(--f);letter-spacing:-.02em;margin:18px 0 12px;text-transform:none}
.big{font:700 clamp(54px,13vw,180px)/1 var(--f);letter-spacing:-.04em;color:#fff;margin:6vh 0 0;text-transform:none}
dialog p{max-width:42rem;font-size:15px;line-height:1.55;letter-spacing:0;text-transform:none;color:var(--ice);margin:0 0 12px}
dialog .mark{color:var(--dim)}
#plainlist{display:none}
body.flat #c,body.flat #fx,body.flat #grain,body.flat #track,body.flat #bl,body.flat #br{display:none}
body.flat .corner{position:static}body.flat #tr{justify-content:flex-start}
body.flat #plainlist{display:block;max-width:44rem;padding:0 20px 60px;text-transform:none;letter-spacing:0;font-size:15px}
body.flat #plainlist h2{font-size:18px;margin:26px 0 4px}body.flat #plainlist p{margin:0}body.flat #plainlist a{color:#8FB0FF;text-decoration:underline}
@media(prefers-reduced-motion:reduce){#grain{display:none}}
</style></head><body class="flat">
<canvas id="c" aria-hidden="true"></canvas><div id="fx"></div><div id="grain"></div><div id="track" aria-hidden="true"></div>
<div class="corner" id="tl"><b id="who"></b><span id="role"></span></div>
<nav class="corner" id="tr" aria-label="Main"><button type="button" id="nWork">Work</button><button type="button" id="nAbout">About</button><button type="button" id="nContact">Contact</button><button type="button" id="nPlain">Plain</button></nav>
<div class="corner" id="bl" aria-live="polite"><span id="code"></span><span id="tag"></span></div>
<div class="corner" id="br"><span id="count"></span></div>
<main id="plainlist"></main>
<dialog id="view" aria-labelledby="vT"><div class="vx"><span id="vC"></span><button type="button" id="vX">Close [Esc]</button></div><div id="vB"></div></dialog>
<noscript><p>This page needs JavaScript. Email: julianwhitney@alumni.wfu.edu</p></noscript>
<script src="drum-content.js"></script>
<script>
/* Words and the viewer first, so everything works even if 3D never loads. */
(()=>{const D=window.DRUM,$=i=>document.getElementById(i),esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
$("who").textContent=D.name;$("role").textContent=D.role;
const link=D.linkedin?`<a href="${esc(D.linkedin)}" rel="noopener">LinkedIn</a>`:"LinkedIn link needed.";
$("plainlist").innerHTML=`<p>${esc(D.about)}</p>`+D.items.map(i=>`<h2>${esc(i.title)}</h2><p>${esc(i.text)}</p>${i.video?`<p><a href="${i.video}">Watch the demo</a></p>`:""}`).join("")+`<h2>Contact</h2><p><a href="mailto:${esc(D.email)}">${esc(D.email)}</a></p><p>${link}</p>`;
const v=$("view");
window.openItem=i=>{$("vC").textContent=i.code;$("vB").innerHTML=(i.video?`<video controls autoplay muted playsinline src="${i.video}"></video>`:`<div class="big">${esc(i.big)}</div>`)+`<h2 id="vT">${esc(i.title)}</h2><p>${esc(i.text)}</p>`;v.showModal();};
const page=(c,t,h)=>{$("vC").textContent=c;$("vB").innerHTML=`<h2 id="vT">${t}</h2>${h}`;v.showModal();};
$("nAbout").onclick=()=>page("About",esc(D.name),`<p>${esc(D.about)}</p>`);
$("nContact").onclick=()=>page("Contact",esc(D.email),`<p><a href="mailto:${esc(D.email)}">Send email</a></p><p class="mark">${link}</p>`);
$("vX").onclick=()=>v.close();v.addEventListener("close",()=>{$("vB").innerHTML="";});
/* Film grain, generated once. */
const n=document.createElement("canvas");n.width=n.height=180;const x=n.getContext("2d"),im=x.createImageData(180,180);for(let i=0;i<im.data.length;i+=4){const q=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=q;im.data[i+3]=255;}x.putImageData(im,0,0);$("grain").style.backgroundImage=`url(${n.toDataURL()})`;
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script src="drum.js"></script>
</body></html>
