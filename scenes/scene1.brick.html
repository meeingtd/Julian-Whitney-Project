    const win=new THREE.MeshBasicMaterial({color:0xFFE3A8});for(const x of[-15,-12,-9,-6,6,9,12,15])for(const y of[2.2,5.5])h.add(box(1.5,1.6,.1,win,x,y,-.05));
    const sign=new THREE.Mesh(new THREE.PlaneGeometry(9,1.1),new THREE.MeshBasicMaterial({map:canvasTex(1024,128,(c,w,ht)=>{c.fillStyle="#F4F1E8";c.fillRect(0,0,w,ht);c.fillStyle="#1B3556";c.font="700 72px Arial,sans-serif";c.textAlign="center";c.textBaseline="middle";c.fillText("EMERSON HOSPITAL",w/2,ht/2+3);})}));sign.position.set(0,5.1,2.63);h.add(box(9.2,1.3,.1,mat(0xDAD6CC),0,5.1,2.56),sign);h.position.z=0;
    sc.add(h);
    const glass=new THREE.MeshLambertMaterial({color:0x9CC4D6,emissive:0x395B6B});const frame=mat(0x2B3540);
    const leaf=(g,dir)=>{g.position.set(dir*1.5,0,0);g.add(box(1.5,3.2,.12,frame,-dir*.75,1.6,0),box(1.1,2.5,.14,glass,-dir*.75,1.7,0),box(.08,.7,.2,mat(0xE0E0E0),-dir*1.3,1.5,.1));sc.add(g);};leaf(doorL,-1);leaf(doorR,1);
    lobby.position.set(0,2.2,.6);sc.add(lobby);}

  /* Dawn mist on the water. */
  const mistTex=canvasTex(128,128,(c)=>{const g=c.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,"rgba(255,240,225,.55)");g.addColorStop(1,"rgba(255,240,225,0)");c.fillStyle=g;c.fillRect(0,0,128,128);});
  const mists=[];for(let i=0;i<28;i++){const a=rnd()*6.28,d=Math.sqrt(rnd());const m=new THREE.Sprite(new THREE.SpriteMaterial({map:mistTex,transparent:true,depthWrite:false,opacity:0,fog:false}));m.scale.set(16+rnd()*12,3+rnd()*2.5,1);m.position.set(PX+Math.cos(a)*d*RX*.95,1.1+rnd()*.8,PZ+Math.sin(a)*d*RZ*.9);m.userData={x:m.position.x,sp:rnd()*.2+.1,ph:rnd()*6};sc.add(m);mists.push(m);}

  /* The one clock. Every pose below is a pure function of t, so scrubbing and playing match. */
  const size=()=>{const w=innerWidth,h=innerHeight;r.setPixelRatio(Math.min(devicePixelRatio||1,w<760?1.5:1.75));r.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?66:46;cam.updateProjectionMatrix();};addEventListener("resize",size);size();
  const walkEnd=17.2,walkStart=1.6;
  const av=V(0,0,0),tan=V(0,0,1),horsePos=V(0,0,0),camA=V(0,0,0),lookA=V(0,0,0),camB=V(0,0,0),lookB=V(0,0,0);
  const SKY=[[0x10203F,0x3A3F5C,0x3A3F5C],[0x7088BC,0xF6B98A,0xE9B79A]];const c1=new THREE.Color(),c2=new THREE.Color();
  const shots=[ /* start time, camera, look target */
    [0,V(0,2.6,18),V(0,3.1,0)],[2.4,V(0,2.4,15.5),V(0,2.7,0)],
    [10,V(19,3.6,35),V(46,2.4,84)],[12.4,V(22,3.6,39),V(56,2.6,90)],
    [14,V(30,2.5,50),V(43,1.5,38)],[17,V(31,2.3,49),V(40,1.5,39)],
    [18.2,V(31.5,1.9,47.6),V(36.8,1.75,41)],[26,V(31.5,1.9,47),V(36.8,1.75,41)],
    [27.2,V(25,3.1,50),V(30,2,38)],[28,V(25,3.1,50),V(31,1.8,38)],[31.5,V(27,2.8,49),V(35,1.8,39)]];
  function shotAt(t){let i=0;while(i<shots.length-2&&t>=shots[i+1][0])i++;const a=shots[i],b=shots[i+1],u=smooth(a[0],b[0],t);camA.lerpVectors(a[1],b[1],u);lookA.lerpVectors(a[2],b[2],u);}
  const label=document.getElementById("label"),labelT=document.getElementById("labelT"),labelS=document.getElementById("labelS"),caption=document.getElementById("caption"),capT=document.getElementById("capT"),fade=document.getElementById("fade"),fill=document.getElementById("fill"),end=document.getElementById("end");
  const LABELS=[[4.6,8.6,"Emerson Hospital","Concord, Massachusetts"],[10.6,14,"Walden Pond","Concord, Massachusetts"],[14.4,17.4,"Henry David Thoreau","Fishing, by his cabin"],[26.6,31.6,"Paul Revere","April 18, 1775"]];
  let shownLabel=-1,clockT=0;
  function pose(t){
    /* World colour */
    const d=smooth(5,13,t);c1.set(SKY[0][0]).lerp(c2.set(SKY[1][0]),d);skyU.top.value.copy(c1);c1.set(SKY[0][1]).lerp(c2.set(SKY[1][1]),d);skyU.low.value.copy(c1);c1.set(SKY[0][2]).lerp(c2.set(SKY[1][2]),d);sc.fog.color.copy(c1);
    hemi.intensity=lerp(.75,1.7,d);sunL.intensity=lerp(.35,2.1,d);sunL.color.set(0xFFD6B0);waterU.sun.value=d;sunDisc.material.opacity=1;sunDisc.position.y=lerp(1,10,d);
    /* Doors */
    const burst=clamp01((t-1.15)/.32),open=1-Math.pow(1-burst,3),rebound=Math.sin(clamp01((t-1.47)/.9)*Math.PI*3)*Math.exp(-clamp01((t-1.47)/.9)*3)*.14;
    doorL.rotation.y=-(open*1.85+rebound);doorR.rotation.y=open*1.85+rebound;lobby.intensity=lerp(0,70,burst)*(1-smooth(5,9,t));
    /* Julian */
    const u=clamp01((t-walkStart)/(walkEnd-walkStart)),dist=u*L;curve.getPointAt(u,av);curve.getTangentAt(u,tan);
    let heading=Math.atan2(tan.x,tan.z);const walking=t>walkStart&&t<walkEnd,phase=dist*2;
    const sw=walking?Math.sin(phase)*.72:0,mount=smooth(31,32,t);
    heading=lerp(heading,Math.atan2(31.5-36,47.6-41),smooth(walkEnd,18.1,t));heading=lerp(heading,Math.PI/2,smooth(30.6,31.4,t));
    /* Horse first, so Julian can climb on. */
    const arrive=smooth(28,31,t),leave=clamp01((t-32)/3.6),lx=4+30.5*(1-Math.pow(1-clamp01((t-28)/3),2.2));
    horsePos.set(lx+leave*leave*52,0,lerp(lerp(37.8,39.9,arrive),38.4,smooth(32,33.5,t)));horse.position.copy(horsePos);horse.visible=t>27.6&&t<36;
    const galloping=(t>28&&t<30.8)||t>32;const gp=horsePos.x*2.1;hLegs.forEach((g,i)=>{g.rotation.x=galloping?Math.sin(gp+i*1.7)*.85:0;});horse.position.y=galloping?Math.abs(Math.sin(gp))*.14:0;
    pr.armR.rotation.x=lerp(-1.1,-1.75,smooth(30.4,31,t)*(1-smooth(31.9,32.3,t)));pr.armL.rotation.x=-1.1;pr.armR.rotation.z=smooth(30.4,31,t)*(1-smooth(31.9,32.3,t))*-.55;
    me.root.position.set(lerp(av.x,horsePos.x-.95,mount),lerp(0,horse.position.y+1.28,mount)+(walking?Math.abs(Math.sin(phase))*.05:0)+Math.sin(mount*Math.PI)*.8,lerp(av.z,horsePos.z,mount));
    me.root.rotation.y=heading;me.root.rotation.z=walking?Math.sin(phase)*.02:0;
    me.legL.rotation.x=lerp(sw,-1.25,mount);me.legR.rotation.x=lerp(-sw,-1.25,mount);me.legL.position.x=lerp(-.25,-.38,mount);me.legR.position.x=lerp(.25,.38,mount);
    /* Waving from the intro, and the keychain twirling on the walk. */
    const wave=smooth(18,18.5,t)*(1-smooth(20,20.5,t));
    me.armL.rotation.x=lerp(-sw*.8,-.6,mount);
    me.armL.rotation.z=-wave*2.65-Math.sin(t*9)*.22*wave;
    const twirl=walking||t<walkStart;me.armR.rotation.x=lerp(twirl?-.55:0,-.9,mount);
    keys.rotation.x=twirl?t*13:Math.sin(t*2)*.12;
    /* Thoreau's small nod as Julian passes. */
    const n=clamp01((t-14.9)/1.2);th.headPivot.rotation.x=Math.sin(n*Math.PI*2)*(1-n)*.34+.02;th.root.rotation.y=0;
    /* Lanterns */
    lanterns.forEach((l,i)=>{const on=smooth(26.7+i*.9,27.1+i*.9,t)*(.86+.14*Math.sin(t*11+i));l.body.material.emissiveIntensity=on*2.2;l.s.material.opacity=on;});
    /* Mist */
    mists.forEach(m=>{m.material.opacity=smooth(8,11,t)*lerp(.82,.1,smooth(12.6,14,t));});
    /* Camera */
    shotAt(t);
    /* Tracking shot: in front of Julian as he leaves the hospital and walks the path. */
    if(t>2.4&&t<14){const k=smooth(2.4,4.2,t)*(1-smooth(8.6,10.6,t));camB.set(av.x+tan.x*7.6+tan.z*1.9,2.3,av.z+tan.z*7.6-tan.x*1.9);lookB.set(av.x,1.4,av.z);camA.lerp(camB,k);lookA.lerp(lookB,k);}
    if(t>31.5){const k=smooth(32,33.4,t);camB.set(horsePos.x-8,3.4,horsePos.z+8.2);lookB.set(horsePos.x,1.9,horsePos.z);camA.lerp(camB,k);lookA.lerp(lookB,k);}
    const hit=t>1.15&&t<1.8?(1-clamp01((t-1.15)/.65))*.09:0,hoof=t>27.5&&t<30.8?.012*Math.sin(t*45):0;
    cam.position.set(camA.x+Math.sin(t*67)*hit,camA.y+Math.cos(t*53)*hit+hoof,camA.z);cam.lookAt(lookA);
    sunL.position.set(cam.position.x+14,28,cam.position.z+34);sunL.target.position.set(cam.position.x,0,cam.position.z-8);
    /* Words */
    let li=-1;LABELS.forEach((l,i)=>{if(t>=l[0]&&t<l[1])li=i;});if(li!==shownLabel){shownLabel=li;if(li>=0){labelT.textContent=LABELS[li][2];labelS.textContent=LABELS[li][3];}}
    if(li>=0){const l=LABELS[li];label.style.opacity=smooth(l[0],l[0]+.35,t)*(1-smooth(l[1]-.35,l[1],t));}else label.style.opacity=0;
    const words=clamp01((t-18.6)/6.8);caption.style.opacity=smooth(18.3,18.7,t)*(1-smooth(26,26.5,t));capT.textContent=LINE.slice(0,Math.ceil(words*LINE.length));
    fade.style.opacity=Math.max(1-smooth(0,1,t),smooth(34,35.2,t));
    const over=t>=35.2;end.style.display=over?"flex":"none";fill.style.transform=`scaleX(${t/T})`;
  }
  /* Playback: autoplay advances the clock and the scroll bar; touching scroll takes over. */
  const pp=document.getElementById("pp"),maxS=()=>Math.max(1,document.documentElement.scrollHeight-innerHeight);
  let playing=!reduced,last=performance.now(),now=0;
  const setPlaying=v=>{playing=v;pp.textContent=playing?"Pause":(clockT>=T?"Replay":"Play");};setPlaying(playing);
  pp.addEventListener("click",()=>{if(clockT>=T-.01){clockT=0;scrollTo(0,0);setPlaying(true);}else setPlaying(!playing);});
  document.getElementById("replay").addEventListener("click",()=>{clockT=0;scrollTo(0,0);setPlaying(true);});
  for(const e of["wheel","touchmove"])addEventListener(e,()=>{if(playing)setPlaying(false);},{passive:true});
  addEventListener("keydown",e=>{if(["ArrowDown","ArrowUp","PageDown","PageUp","Space","Home","End"].includes(e.code)&&e.target===document.body&&playing)setPlaying(false);});
  function loop(n){requestAnimationFrame(loop);const dt=Math.min((n-last)/1000,.1);last=n;now+=dt;
    if(playing){clockT=Math.min(T,clockT+dt);scrollTo(0,clockT/T*maxS());if(clockT>=T)setPlaying(false);}
    else{const goal=Math.min(1,scrollY/maxS())*T;clockT+=(goal-clockT)*(1-Math.exp(-dt*7));}
    waterU.t.value=now;mists.forEach(m=>{m.position.x=m.userData.x+Math.sin(now*m.userData.sp+m.userData.ph)*2.4;});bob.position.y=.08+Math.sin(now*1.7)*.02;
    pose(clockT);r.render(sc,cam);}
  requestAnimationFrame(loop);
}
